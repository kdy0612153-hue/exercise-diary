<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>운동 기록</title>
  <style>
    :root{--ink:#14231b;--muted:#718077;--green:#18794b;--green-soft:#d9f7e7;--line:#e1e9e3;--paper:#fffdfa;--orange:#f07d61}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#effaf3,#fffaf5 70%);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Apple SD Gothic Neo",system-ui,sans-serif}main{width:min(740px,calc(100% - 32px));margin:auto;padding:42px 0 60px}h1{margin:0;font-size:clamp(32px,7vw,48px);letter-spacing:-2.5px;line-height:1.05}.lead{color:var(--muted);margin:10px 0 27px;font-weight:600}.card{background:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.9);border-radius:25px;padding:22px;box-shadow:0 16px 45px rgba(35,73,51,.09)}.record-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.label{display:block;color:var(--muted);font-size:13px;font-weight:800;margin:0 0 8px 3px}input,textarea,select{font:inherit;color:var(--ink);border:1px solid var(--line);background:var(--paper);border-radius:13px;outline:0}input:focus,textarea:focus,select:focus{border-color:#62ad82;box-shadow:0 0 0 3px var(--green-soft)}input[type=date]{padding:10px 12px;font-weight:750}textarea{width:100%;min-height:96px;resize:vertical;padding:13px}.fields{display:grid;grid-template-columns:1fr 150px;gap:13px;margin:15px 0}.toggle{display:flex;align-items:center;gap:11px;padding:8px 0;font-weight:800;cursor:pointer}.toggle input{appearance:none;width:48px;height:29px;border:0;border-radius:99px;background:#cbd6cf;position:relative;cursor:pointer;transition:.2s}.toggle input:after{content:"";position:absolute;width:21px;height:21px;border-radius:50%;top:4px;left:4px;background:white;box-shadow:0 1px 4px #627066;transition:.2s}.toggle input:checked{background:var(--green)}.toggle input:checked:after{left:23px}.save{width:100%;border:0;border-radius:13px;background:var(--ink);color:white;font:inherit;font-weight:850;padding:13px;cursor:pointer}.save.saved{background:var(--green)}.section{margin-top:34px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}.section-title{font-size:19px;font-weight:900;letter-spacing:-.5px}.controls{display:flex;gap:7px}.controls select{padding:8px 9px;font-size:13px;font-weight:750}.legend{font-size:12px;color:var(--muted);margin-bottom:12px}.dot{display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--green);margin:0 4px 0 10px}.dot:first-child{margin-left:0}.dot.off{background:#e8eee9}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dow{text-align:center;color:var(--muted);font-size:11px;font-weight:800;padding-bottom:2px}.day{aspect-ratio:1;min-height:42px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.6);padding:6px;text-align:left;color:var(--muted);font-size:12px;cursor:pointer;position:relative}.day:hover{border-color:#78ba95}.day.done{background:var(--green-soft);border-color:#a1dbb7;color:var(--green);font-weight:900}.day.done:after{content:"✓";position:absolute;right:6px;bottom:4px;font-size:15px}.day.today{outline:2px solid var(--orange);outline-offset:1px}.day.blank{visibility:hidden;cursor:default}.year-chart{display:grid;grid-template-columns:repeat(12,1fr);align-items:end;gap:6px;height:175px;border-bottom:1px solid var(--line);padding:0 4px}.month{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px;min-width:0}.bar-wrap{height:132px;width:100%;display:flex;align-items:flex-end;background:#edf2ee;border-radius:6px 6px 2px 2px;overflow:hidden}.bar{width:100%;height:0;background:linear-gradient(180deg,#5cc98a,var(--green));border-radius:6px 6px 0 0;transition:height .35s}.month b{font-size:10px;color:var(--muted);font-weight:750}.summary{margin-top:13px;color:var(--muted);font-size:13px;font-weight:650}.summary strong{color:var(--green)}footer{text-align:center;color:var(--muted);font-size:12px;margin:30px 0 0}@media(max-width:500px){main{width:min(100% - 22px,740px);padding-top:27px}.card{padding:17px}.fields{grid-template-columns:1fr}.calendar{gap:4px}.day{min-height:35px;padding:4px}.year-chart{gap:3px}.month b{font-size:9px}}
  </style>
</head>
<body>
  <main>
    <h1>운동을 기록해요.</h1><p class="lead">기록한 날만 운동한 날로 표시됩니다.</p>
    <section class="card"><div class="record-head"><div><span class="label">운동한 날짜</span><input type="date" id="recordDate" /></div><label class="toggle"><input type="checkbox" id="exercised" /><span>운동했어요</span></label></div><div class="fields"><div><label class="label" for="activity">어떤 운동을 했나요?</label><input id="activity" maxlength="50" placeholder="예: 러닝 5km" /></div><div><label class="label" for="minutes">운동 시간 (분)</label><input id="minutes" type="number" min="1" max="1440" placeholder="30" /></div></div><label class="label" for="memo">짧은 기록</label><textarea id="memo" maxlength="500" placeholder="컨디션, 느낀 점을 남겨보세요."></textarea><button class="save" id="save">기록 저장</button></section>
    <section class="section"><div class="section-head"><div class="section-title">월별 기록</div><div class="controls"><select id="month"></select><select id="year"></select></div></div><div class="legend"><span class="dot"></span>운동 기록 <span class="dot off"></span>기록 없음 · 운동 안 함</div><div class="calendar" id="calendar"></div><div class="summary" id="monthSummary"></div></section>
    <section class="section"><div class="section-head"><div class="section-title">연도별 흐름</div><div class="controls"><select id="chartYear"></select></div></div><div class="year-chart" id="yearChart"></div><div class="summary" id="yearSummary"></div></section><footer>기록은 이 기기의 브라우저에 저장됩니다.</footer>
  </main>
  <script>
    const $=s=>document.querySelector(s),storage='exercise-diary-v2',today=new Date().toISOString().slice(0,10);let data=JSON.parse(localStorage.getItem(storage)||'{"records":{}}');if(!data.records)data.records={};$('#recordDate').value=today;
    const dateId=(y,m,d)=>`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const persist=()=>localStorage.setItem(storage,JSON.stringify(data));const current=()=>data.records[$('#recordDate').value];
    function loadRecord(){const r=current();$('#exercised').checked=!!r?.exercised;$('#activity').value=r?.activity||'';$('#minutes').value=r?.minutes||'';$('#memo').value=r?.memo||''}
    function save(){const id=$('#recordDate').value;if(!id)return;if($('#exercised').checked)data.records[id]={exercised:true,activity:$('#activity').value.trim(),minutes:$('#minutes').value,memo:$('#memo').value.trim()};else delete data.records[id];persist();const b=$('#save');b.textContent='저장했어요 ✓';b.classList.add('saved');setTimeout(()=>{b.textContent='기록 저장';b.classList.remove('saved')},1400);renderAll()}
    function populate(){const now=new Date().getFullYear(),years=new Set([now]);Object.keys(data.records).forEach(d=>years.add(+d.slice(0,4)));const options=[...years].sort((a,b)=>b-a).map(y=>`<option value="${y}">${y}년</option>`).join('');['year','chartYear'].forEach(id=>{const old=$('#'+id).value;$('#'+id).innerHTML=options;$('#'+id).value=old||now});$('#month').innerHTML=Array.from({length:12},(_,i)=>`<option value="${i}">${i+1}월</option>`).join('');if(!$('#month').dataset.ready){$('#month').value=new Date().getMonth();$('#month').dataset.ready='1'}}
    function renderCalendar(){const y=+$('#year').value,m=+$('#month').value,cal=$('#calendar');cal.innerHTML=['일','월','화','수','목','금','토'].map(x=>`<div class="dow">${x}</div>`).join('');const first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();for(let i=0;i<first;i++)cal.insertAdjacentHTML('beforeend','<div class="day blank"></div>');let done=0;for(let d=1;d<=last;d++){const id=dateId(y,m,d),r=data.records[id],el=document.createElement('button');el.type='button';el.className='day '+(r?.exercised?'done ':'')+(id===today?'today':'');el.textContent=d;el.title=r?.activity||`${d}일`;el.onclick=()=>{$('#recordDate').value=id;loadRecord();window.scrollTo({top:0,behavior:'smooth'})};cal.append(el);if(r?.exercised)done++}$('#monthSummary').innerHTML=`<strong>${done}일</strong> 운동했어요 · 이번 달 ${last-done}일은 기록이 없어요.`}
    function renderYear(){const y=+$('#chartYear').value,chart=$('#yearChart');chart.innerHTML='';let total=0;for(let m=0;m<12;m++){const days=new Date(y,m+1,0).getDate();let count=0;for(let d=1;d<=days;d++)if(data.records[dateId(y,m,d)]?.exercised)count++;total+=count;const p=Math.round(count/days*100),el=document.createElement('div');el.className='month';el.innerHTML=`<div class="bar-wrap" title="${m+1}월: ${count}일"><div class="bar" style="height:${p}%"></div></div><b>${m+1}월</b>`;chart.append(el)}$('#yearSummary').innerHTML=`<strong>${y}년 ${total}일</strong> 운동 기록 · 막대 높이는 각 달의 운동한 날 비율입니다.`}
    function renderAll(){populate();renderCalendar();renderYear()}$('#recordDate').onchange=loadRecord;$('#save').onclick=save;$('#month').onchange=renderCalendar;$('#year').onchange=renderCalendar;$('#chartYear').onchange=renderYear;renderAll();loadRecord();
  </script>
</body>
</html>
